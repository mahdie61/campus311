<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMD Campus 311</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    .frame {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 545px;       /* عرض کارت فرم */
      height: 100%;
      height: 100dvh;
      overflow: hidden;       /* اسکرول‌بار iframe را می‌برد */
      background: #fff;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.15);
    }
    .frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 560px;           /* 545 + حدود 15px برای اسکرول‌بار که بریده می‌شود */
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
    }
    @media (max-width: 560px) {
      .frame iframe { width: 100%; }   /* موبایل: اسکرول‌بار شناور است */
    }
  </style>
</head>
<body>
  <div class="frame">
    <iframe
      name="survey123webform"
      title="UMD Campus 311: Non-Emergency Service Requests"
      src="https://survey123.arcgis.com/share/0a0727884c2444b68f3b56ec6bb5066f"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      allow="geolocation https://survey123.arcgis.com; camera https://survey123.arcgis.com">
    </iframe>
  </div>
</body>
</html>
