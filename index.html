<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMD Campus 311</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;          /* White everywhere: no gray around the card */
    }
    .frame {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 545px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;          /* No shadow, so the card blends into the page */
    }
    .hdr {
      flex: none;
      margin: 0;
      padding: 16px 20px;
      background: #338a2e;
      color: #fff;
      text-align: center;
      font: 600 clamp(18px, 4.6vw, 22px)/1.3 "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .view {
      flex: 1;
      position: relative;
      overflow: hidden;          /* Clips the iframe's own scrollbar */
    }
    .view iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100% + 40px);  /* Extra width pushes the scrollbar out of view */
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
    }
    /* Desktop and wide screens: keep the title on a single line */
    @media (min-width: 561px) {
      .hdr { font-size: 19px; padding: 16px 12px; white-space: nowrap; }
    }
    /* Mobile: scrollbars overlay the content, so no extra width is needed */
    @media (max-width: 560px) {
      .view iframe { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1 class="hdr">UMD Campus 311: Non-Emergency Service Requests</h1>
    <div class="view">
      <iframe
        name="survey123webform"
        title="UMD Campus 311: Non-Emergency Service Requests"
        src="https://survey123.arcgis.com/share/0a0727884c2444b68f3b56ec6bb5066f?hide=header,footer"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        allow="geolocation https://survey123.arcgis.com; camera https://survey123.arcgis.com">
      </iframe>
    </div>
  </div>
</body>
</html>
